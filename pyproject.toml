[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-connectome"
version = "0.1.0"
description = "Experimental connectome-inspired neural simulation research scaffold"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Research prototype; see data-specific terms before use" }
authors = [{ name = "Cortex project contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
include = ["cortex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
