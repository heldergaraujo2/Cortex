name: T4 Gruntman physiology acquisition
on:
  push:
    branches: [experiment/synthetic-neural-learning-smoke]
    paths: ['.github/workflows/t4-gruntman-acquisition.yml']
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download experimental dataset and verify sizes
        run: python scripts/acquire_t4_gruntman.py --manifest data/t4/gruntman_manifest.json --download
      - name: Publish acquisition manifest and data as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gruntman-t4-physiology
          path: data/t4/
          if-no-files-found: warn
          retention-days: 7
