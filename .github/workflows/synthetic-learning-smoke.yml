name: Synthetic learning smoke
on:
  push:
    branches:
      - experiment/synthetic-neural-learning-smoke
  pull_request:
  workflow_dispatch:
jobs:
  experiment:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_associative_experiment.py
      - run: python -c "from cortex.experiments.associative import run_experiment; print(run_experiment())"
