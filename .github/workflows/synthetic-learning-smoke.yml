name: Synthetic learning smoke
on:
  push:
    branches:
      - experiment/synthetic-neural-learning-smoke
  pull_request:
  workflow_dispatch:
jobs:
  experiment:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_associative_experiment.py
      - run: python -c "from cortex.experiments.associative import run_experiment; print(run_experiment())"

  real-fafb-data-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Verify actual FAFB inputs, never substitute synthetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          files = sorted(Path("para-validacao").rglob("*.csv.gz"))
          connections = [str(p) for p in files if "connections_princeton" in p.name.lower()]
          annotations = [str(p) for p in files if "consolidated_cell_types" in p.name.lower()]
          report = {"connections": connections, "annotations": annotations,
                    "status": "ready" if connections and annotations else "blocked_missing_real_data"}
          Path("fafb-input-gate.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          if report["status"] != "ready":
              raise SystemExit("REAL_DATA_BLOCKED: required FAFB CSV.GZ inputs missing")
          PY
      - name: Upload real data gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fafb-real-data-gate
          path: fafb-input-gate.json
          if-no-files-found: warn
