name: Synthetic learning smoke
on:
  push:
    branches:
      - experiment/synthetic-neural-learning-smoke
  pull_request:
  workflow_dispatch:
jobs:
  experiment:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_associative_experiment.py
      - run: python -c "from cortex.experiments.associative import run_experiment; print(run_experiment())"

  real-fafb-data-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Checkout actual FAFB dataset from its dedicated branch
        uses: actions/checkout@v4
        with:
          ref: data/fafb-v783-inputs
          path: fafb-source
          sparse-checkout: |
            data/raw/fafb_v783
          lfs: true
      - name: Stage actual FAFB files for validation
        shell: bash
        run: |
          set -euo pipefail
          test -s fafb-source/data/raw/fafb_v783/connections_princeton.csv.gz
          test -s fafb-source/data/raw/fafb_v783/consolidated_cell_types.csv.gz
          mkdir -p para-validacao
          cp fafb-source/data/raw/fafb_v783/connections_princeton.csv.gz para-validacao/
          cp fafb-source/data/raw/fafb_v783/consolidated_cell_types.csv.gz para-validacao/
      - name: Verify actual FAFB inputs, never substitute synthetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          files = sorted(Path("para-validacao").rglob("*.csv.gz"))
          connections = [str(p) for p in files if "connections_princeton" in p.name.lower()]
          annotations = [str(p) for p in files if "consolidated_cell_types" in p.name.lower()]
          report = {"connections": connections, "annotations": annotations,
                    "status": "ready" if connections and annotations else "blocked_missing_real_data"}
          Path("fafb-input-gate.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          if report["status"] != "ready":
              raise SystemExit("REAL_DATA_BLOCKED: required FAFB CSV.GZ inputs missing")
          PY
      - name: Upload real data gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fafb-real-data-gate
          path: fafb-input-gate.json
          if-no-files-found: warn

  acquire-t4-physiology:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and verify Gruntman T4 physiology data
        run: python scripts/acquire_t4_gruntman.py --manifest data/t4/gruntman_manifest.json --download
      - name: Inventory experimental files and archive contents
        run: python scripts/inventory_t4_gruntman.py --manifest data/t4/gruntman_manifest.json --output data/t4/gruntman_inventory.json
      - name: Classify MATLAB experimental record headers
        run: python scripts/inspect_t4_mat_headers.py --manifest data/t4/gruntman_manifest.json --output data/t4/gruntman_mat_headers.json
      - name: Install MATLAB metadata readers
        run: python -m pip install scipy h5py
      - name: Probe bounded MATLAB variable metadata
        run: python scripts/probe_t4_mat_variables.py --manifest data/t4/gruntman_manifest.json --output data/t4/gruntman_mat_variables.json --max-files 8 --max-member-mb 150
      - name: Inspect nested protocolStruct field names
        run: python scripts/inspect_t4_struct_fields.py --manifest data/t4/gruntman_manifest.json --output data/t4/gruntman_struct_fields.json --max-files 3
      - name: Inspect nested stimulus schema and bounded values
        run: python scripts/inspect_t4_stimulus_schema.py --manifest data/t4/gruntman_manifest.json --output data/t4/gruntman_stimulus_schema.json --max-files 3
      - name: Upload acquisition evidence and files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gruntman-t4-physiology
          path: data/t4/
          if-no-files-found: warn
          retention-days: 7
