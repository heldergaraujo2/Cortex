name: T4 biological reference gate tests

on:
  push:
    branches:
      - experiment/synthetic-neural-learning-smoke
    paths:
      - 'cortex/t4_biological_reference.py'
      - 'tests/test_t4_biological_reference.py'
      - '.github/workflows/t4-biological-reference-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run targeted tests
        run: python -m pytest -q tests/test_t4_biological_reference.py
