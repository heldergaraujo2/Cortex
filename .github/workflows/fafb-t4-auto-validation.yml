name: FAFB T4 automatic validation
on:
  push:
    branches:
      - experiment/synthetic-neural-learning-smoke
    paths:
      - 'cortex/experiments/t4_directional_response.py'
      - 'cortex/experiments/t4_real_graph_experiment.py'
      - 'cortex/experiments/t4_response_diagnostics.py'
      - 'tests/test_t4_directional_response.py'
      - 'tests/test_t4_response_diagnostics.py'
      - 'cortex/experiments/t4_validation_gates.py'
      - 'tests/test_t4_validation_gates.py'
      - '.github/workflows/fafb-t4-auto-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t4-auto:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data/fafb-v783-inputs
          path: fafb-source
          sparse-checkout: |
            data/raw/fafb_v783
      - name: Verify FAFB input files
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path('fafb-source/data/raw/fafb_v783')
          for name in ('consolidated_cell_types.csv.gz', 'column_assignment.csv.gz', 'connections_princeton.csv.gz'):
              path=base/name
              assert path.is_file() and path.stat().st_size > 0, f'Missing or empty FAFB input: {path}'
              print(f'{name}: {path.stat().st_size:,} bytes')
          PY
      - name: Targeted new tests
        run: |
          python -m unittest discover -s tests -p 'test_t4_directional_response.py' -v
          python -m unittest discover -s tests -p 'test_t4_response_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_t4_validation_gates.py' -v
      - name: Normalized real graph experiment
        run: |
          python -m cortex.experiments.t4_real_graph_experiment \
            --annotations fafb-source/data/raw/fafb_v783/consolidated_cell_types.csv.gz \
            --columns fafb-source/data/raw/fafb_v783/column_assignment.csv.gz \
            --connections fafb-source/data/raw/fafb_v783/connections_princeton.csv.gz \
            --output t4-normalized-response.json
      - name: Validate and diagnose
        run: |
          python - <<'PY'
          import json, math
          from cortex.experiments.t4_response_diagnostics import diagnose
          d=json.load(open('t4-normalized-response.json'))
          assert d['responses']['normalize_outgoing']
          assert d['retained_edges'] > 0
          audit=d['stimulus_drive_audit']
          print('Directional stimulus drive audit:',json.dumps(audit,sort_keys=True))
          assert audit['equal_frame_counts'], 'Unequal stimulus frame counts'
          assert not d['biological_direction_selectivity_validated']
          assert all(math.isfinite(v) for m in d['metrics'].values() for v in m['responses'].values())
          from cortex.experiments.t4_validation_gates import assess
          gates=assess(d)
          assert gates['numerical_finite_integrated'] and gates['numerical_finite_traces'] and gates['baseline_near_zero']
          gates['stimulus_equal_total_input_events']=audit['equal_total_input_events']
          gates['stimulus_equal_frame_counts']=audit['equal_frame_counts']
          open('t4-validation-gates.json','w').write(json.dumps(gates,indent=2))
          result=diagnose(d)
          open('t4-normalized-diagnostics.json','w').write(json.dumps(result,indent=2))
          assert set(d['metrics']) == {'T4a','T4b','T4c','T4d'}, sorted(d['metrics'])
          print('subtype winners:', result['subtype_winners'])
          print('all share winner:',result['all_subtypes_share_winner'])
          summary={}
          for subtype, metrics in sorted(d['metrics'].items()):
              dsi=metrics.get('direction_selectivity_index')
              assert dsi is None or (math.isfinite(dsi) and -1 <= dsi <= 1), (subtype,dsi)
              summary[subtype]={
                  'preferred_condition':metrics['preferred_condition'],
                  'opposite_condition':metrics.get('opposite_condition'),
                  'direction_selectivity_index':dsi,
                  'responses':metrics['responses'],
              }
              print(subtype,'preferred:',summary[subtype]['preferred_condition'],
                    'opposite:',summary[subtype]['opposite_condition'],'DSI:',dsi)
          open('t4-direction-selectivity-summary.json','w').write(json.dumps({
              'schema':'cortex.t4_direction_selectivity_summary.v1',
              'subtypes':summary,
              'biological_direction_selectivity_validated':False,
              'interpretation':'Descriptive DSI only; no independent physiology or anatomical axis calibration'
          },indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fafb-t4-auto-validation
          path: |
            t4-normalized-response.json
            t4-normalized-diagnostics.json
            t4-validation-gates.json
            t4-direction-selectivity-summary.json
          if-no-files-found: warn
