name: FAFB T4 real graph response experiment
on:
  workflow_dispatch:
jobs:
  t4-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/synthetic-neural-learning-smoke
      - uses: actions/checkout@v4
        with:
          ref: data/fafb-v783-inputs
          path: fafb-source
          sparse-checkout: |
            data/raw/fafb_v783
      - name: Test new graph response engine
        run: python -m unittest discover -s tests -p 'test_t4_directional_response.py' -v
      - name: Run real FAFB exploratory graph response
        run: |
          python -m cortex.experiments.t4_real_graph_experiment \
            --annotations fafb-source/data/raw/fafb_v783/consolidated_cell_types.csv.gz \
            --columns fafb-source/data/raw/fafb_v783/column_assignment.csv.gz \
            --connections fafb-source/data/raw/fafb_v783/connections_princeton.csv.gz \
            --output t4-real-graph-response.json
      - name: Check result and honest validation flags
        run: |
          python - <<'PY'
          import json
          d=json.load(open('t4-real-graph-response.json'))
          assert d['retained_edges'] > 0
          assert all(d['t4_annotation_counts'].get(t, 0) > 0 for t in ('T4a','T4b','T4c','T4d'))
          assert set(d['metrics']) == {'T4a','T4b','T4c','T4d'}
          assert d['real_fafb_experiment_executed']
          assert not d['biological_direction_selectivity_validated']
          print('Real FAFB graph propagation executed; biological direction selectivity not validated')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fafb-t4-real-graph-response
          path: t4-real-graph-response.json
