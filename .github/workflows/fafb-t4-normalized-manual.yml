name: FAFB T4 normalized graph experiment
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fafb-t4-normalized-manual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  normalized-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/synthetic-neural-learning-smoke
      - uses: actions/checkout@v4
        with:
          ref: data/fafb-v783-inputs
          path: fafb-source
          sparse-checkout: |
            data/raw/fafb_v783
      - name: Verify FAFB input files
        run: |
          python - <<'PY'
          from pathlib import Path
          base = Path('fafb-source/data/raw/fafb_v783')
          for name in ('consolidated_cell_types.csv.gz', 'column_assignment.csv.gz', 'connections_princeton.csv.gz'):
              path = base / name
              assert path.is_file() and path.stat().st_size > 0, f'Missing or empty: {path}'
              print(f'{name}: {path.stat().st_size:,} bytes')
          PY
      - name: Run targeted recurrence and propagation tests
        run: python -m unittest discover -s tests -p 'test_t4_directional_response.py' -v
      - name: Run directional diagnostics and validation gate tests
        run: |
          python -m unittest discover -s tests -p 'test_t4_response_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_t4_validation_gates.py' -v
      - name: Run normalized real FAFB experiment
        run: |
          python -m cortex.experiments.t4_real_graph_experiment \
            --annotations fafb-source/data/raw/fafb_v783/consolidated_cell_types.csv.gz \
            --columns fafb-source/data/raw/fafb_v783/column_assignment.csv.gz \
            --connections fafb-source/data/raw/fafb_v783/connections_princeton.csv.gz \
            --output t4-normalized-response.json
      - name: Check finite results and report subtype winners
        run: |
          python - <<'PY'
          import json, math
          d=json.load(open('t4-normalized-response.json'))
          assert d['responses']['normalize_outgoing']
          assert d['retained_edges'] > 0
          assert not d['biological_direction_selectivity_validated']
          assert set(d['metrics']) == {'T4a','T4b','T4c','T4d'}
          from cortex.experiments.t4_validation_gates import assess
          from cortex.experiments.t4_response_diagnostics import diagnose
          gates=assess(d)
          assert gates['numerical_finite_integrated'] and gates['numerical_finite_traces'] and gates['baseline_near_zero']
          open('t4-validation-gates.json','w').write(json.dumps(gates,indent=2))
          open('t4-normalized-diagnostics.json','w').write(json.dumps(diagnose(d),indent=2))
          summary={}
          for t, metrics in d['metrics'].items():
              assert all(math.isfinite(v) for v in metrics['responses'].values())
              dsi=metrics.get('direction_selectivity_index')
              assert dsi is None or (math.isfinite(dsi) and -1 <= dsi <= 1)
              summary[t]={'preferred_condition':metrics['preferred_condition'], 'opposite_condition':metrics.get('opposite_condition'), 'direction_selectivity_index':dsi, 'responses':metrics['responses']}
              print(t, metrics['preferred_condition'], 'DSI:', dsi, metrics['responses'])
          open('t4-direction-selectivity-summary.json','w').write(json.dumps({'subtypes':summary, 'biological_direction_selectivity_validated':False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fafb-t4-normalized-response
          if-no-files-found: warn
          path: |
            t4-normalized-response.json
            t4-normalized-diagnostics.json
            t4-validation-gates.json
            t4-direction-selectivity-summary.json
