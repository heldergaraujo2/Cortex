name: Cortex Programador checks
on:
  push:
    branches:
      - feat/autonomous-coding-three-stages
  pull_request:
    paths:
      - 'cortex/coding_agent/**'
      - 'tests/test_coding_agent*.py'
      - '.github/workflows/cortex-programador.yml'
  workflow_dispatch:
jobs:
  coding-agent-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_coding_agent.py tests/test_coding_agent_ollama.py
