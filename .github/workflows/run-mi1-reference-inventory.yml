name: Run Mi1 anatomical reference inventory

on:
  push:
    branches:
      - research/phase-8-anatomical-column-reference
    paths:
      - scripts/inspect_mi1_reference.R
      - scripts/inspect_mi1_reference_structure.R
      - data/external/eyemap_T4/**
      - .github/workflows/run-mi1-reference-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-mi1-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/phase-8-anatomical-column-reference

      - name: Set up R 4.4.1
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'

      - name: Run read-only Gate 8A inventory
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/inspect_mi1_reference.R \
            data/external/eyemap_T4/neu_Mi1.RData \
            data/external/eyemap_T4/Mi1_ind.RData \
            phase8_mi1_inventory
          Rscript scripts/inspect_mi1_reference_structure.R \
            data/external/eyemap_T4/neu_Mi1.RData \
            data/external/eyemap_T4/Mi1_ind.RData \
            phase8_mi1_inventory

      - name: Upload inventory results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-mi1-inventory
          path: phase8_mi1_inventory/
          if-no-files-found: warn
          retention-days: 30
