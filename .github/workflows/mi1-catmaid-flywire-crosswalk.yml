name: Mi1 CATMAID to FlyWire v783 crosswalk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosswalk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/phase-8-anatomical-column-reference

      - name: Check required FlyWire credential
        shell: bash
        env:
          FLYWIRE_TOKEN: ${{ secrets.FLYWIRE_TOKEN }}
        run: |
          if [ -z "$FLYWIRE_TOKEN" ]; then
            echo "Missing repository secret FLYWIRE_TOKEN." >&2
            echo "Add it under Settings > Secrets and variables > Actions, then rerun this workflow." >&2
            exit 1
          fi

      - name: Set up R 4.4.1
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'

      - name: Generate verified Mi1 CATMAID input
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/inspect_mi1_reference.R \
            data/external/eyemap_T4/neu_Mi1.RData \
            data/external/eyemap_T4/Mi1_ind.RData \
            phase8_mi1_inventory

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fafbseg
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fafbseg==3.2.3"

      - name: Map CATMAID skeletons to FlyWire v783
        env:
          FLYWIRE_TOKEN: ${{ secrets.FLYWIRE_TOKEN }}
          CATMAID_API_TOKEN: ${{ secrets.CATMAID_API_TOKEN }}
        run: |
          python scripts/crosswalk_mi1_catmaid_flywire.py \
            --input phase8_mi1_inventory/mi1_catmaid_skids_for_crosswalk.csv \
            --output phase8_mi1_crosswalk/mi1_catmaid_to_flywire_v783.csv \
            --batch-size 10

      - name: Upload crosswalk artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi1-catmaid-flywire-v783-crosswalk
          path: phase8_mi1_crosswalk/
          if-no-files-found: warn
          retention-days: 30
