name: FAFB v783 Data Validation

on:
  pull_request:
    paths:
      - "data/raw/fafb_v783/**"
      - "cortex/connectome.py"
      - "scripts/inspect_fafb_data.py"
      - "scripts/import_fafb_pilot.py"
      - "tests/test_connectome.py"
      - ".github/workflows/fafb-data-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect compressed CSV files
        run: python scripts/inspect_fafb_data.py
      - name: Import reduced pilot and build manifest
        run: >-
          python scripts/import_fafb_pilot.py
          --data-dir data/raw/fafb_v783
          --output fafb_v783_pilot_manifest.json
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fafb-v783-validation-report
          path: |
            fafb_v783_validation_report.json
            fafb_v783_pilot_manifest.json
          if-no-files-found: warn
