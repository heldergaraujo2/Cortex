name: FAFB v783 Data Validation

on:
  pull_request:
    paths:
      - "data/raw/fafb_v783/**"
      - "scripts/inspect_fafb_data.py"
      - ".github/workflows/fafb-data-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect compressed CSV files
        run: python scripts/inspect_fafb_data.py
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fafb-v783-validation-report
          path: fafb_v783_validation_report.json
          if-no-files-found: warn
